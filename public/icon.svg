<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Scale of Justice & Wealth Purification Symbol -->
  <g transform="translate(256, 256)" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Column -->
    <line x1="0" y1="-120" x2="0" y2="130" stroke="#34d399" stroke-width="20"/>
    <circle cx="0" cy="-120" r="16" fill="#34d399"/>
    <path d="M-60,130 L60,130" stroke="#34d399" stroke-width="22"/>

    <!-- Beam -->
    <path d="M-130,-70 L130,-70" stroke="#6ee7b7" stroke-width="16"/>

    <!-- Left Pan -->
    <line x1="-130" y1="-70" x2="-170" y2="20" stroke="#34d399" stroke-width="8"/>
    <line x1="-130" y1="-70" x2="-90" y2="20" stroke="#34d399" stroke-width="8"/>
    <path d="M-180,20 Q-130,65 -80,20 Z" fill="#047857" stroke="#34d399" stroke-width="10"/>

    <!-- Right Pan -->
    <line x1="130" y1="-70" x2="90" y2="20" stroke="#34d399" stroke-width="8"/>
    <line x1="130" y1="-70" x2="170" y2="20" stroke="#34d399" stroke-width="8"/>
    <path d="M80,20 Q130,65 180,20 Z" fill="#047857" stroke="#34d399" stroke-width="10"/>
  </g>
</svg>
