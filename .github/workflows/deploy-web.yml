name: Deploy Web App to GitHub Pages & Build Multi-Platform Releases

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permissions for GitHub Pages deployment & Release artifacts
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Build & Deploy Web SPA to GitHub Pages
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application (Vite PWA)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 2. Build Android Signed AAB & Sideload APK
  build-android-release:
    name: Build Android Release AAB & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Release Bundle (.aab) & APK
        run: |
          cd android
          ./gradlew :app:bundleRelease :app:assembleDebug --stacktrace

      - name: Upload Release AAB (For Google Play Closed & Internal Tracks)
        uses: actions/upload-artifact@v4
        with:
          name: SadaCash-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Installable APK (Direct Sideload)
        uses: actions/upload-artifact@v4
        with:
          name: SadaCash-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

